[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "avito-candidates"
version = "0.1.0"
description = "Offline service-ad candidate retrieval with Recall@50 evaluation"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "pyarrow>=18,<26", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "snowballstemmer>=3.1,<4"]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.2,<6", "hnswlib>=0.8,<1"]

[project.scripts]
avito = "avito_candidates.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
