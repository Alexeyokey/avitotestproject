<svg xmlns="http://www.w3.org/2000/svg" width="960" height="405" viewBox="0 0 960 405" role="img" aria-labelledby="title desc">
<title id="title">Вклад географических каналов BM25</title>
<desc id="desc">Локальная проверка на 5157 группах. Recall пула вырос с 84,22% до 94,72%, Recall@50 — с 70,59% до 76,99%.</desc>
