<text x="36.0" y="76.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#54657A">split=queries · seed=42 · k=500 · бонус локации 0,1</text>
<line x1="225.0" y1="122.0" x2="225.0" y2="354.0" stroke="#DDE4EC" stroke-width="1"/>
