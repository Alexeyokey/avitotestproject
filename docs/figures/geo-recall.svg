<rect x="225.0" y="95.0" width="17.0" height="17.0" rx="2" fill="#4567A7"/>
<text x="250.0" y="109.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17253A">Глобальный поиск</text>
<rect x="429.0" y="95.0" width="17.0" height="17.0" rx="2" fill="#087F78"/>
<text x="454.0" y="109.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#17253A">С географическими каналами</text>
<text x="36.0" y="189.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#17253A">Recall пула</text>
