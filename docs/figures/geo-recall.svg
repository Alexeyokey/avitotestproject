<text x="624.0" y="384.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#54657A">60%</text>
<line x1="757.0" y1="122.0" x2="757.0" y2="354.0" stroke="#DDE4EC" stroke-width="1"/>
<text x="757.0" y="384.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#54657A">80%</text>
